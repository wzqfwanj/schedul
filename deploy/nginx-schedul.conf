# 日程表 nginx 站点配置模板
#
# 安装：
#   sudo cp deploy/nginx-schedul.conf /etc/nginx/sites-available/schedul
#   sudo ln -s /etc/nginx/sites-available/schedul /etc/nginx/sites-enabled/schedul
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 1) 把下面的 example.com 全部替换成你自己的域名。
# 2) 先用 HTTP 验证能访问，再执行 certbot --nginx 自动添加 443/证书/跳转：
#      sudo certbot --nginx -d example.com -m admin@example.com --agree-tos --redirect
# 3) 启用 HTTPS 后，把 /etc/schedul.env 中 COOKIE_SECURE 改为 1 并重启 schedul。

upstream schedul_upstream {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 隐藏 nginx 版本号
    server_tokens off;

    access_log /var/log/nginx/schedul.access.log;
    error_log  /var/log/nginx/schedul.error.log;

    # 应用单张截图上限 10MB；这里留一点余量，避免 nginx 先返回 413
    client_max_body_size 12m;

    # 可选：由 nginx 直接返回静态资源（CSS/JS/图标）。
    # 需要 /opt/schedul 对 www-data 可读（目录 755、文件 644）。
    # 不想让 nginx 读取代码目录时，删除这个 location，静态文件交给 Flask 返回。
    location /static/ {
        alias /opt/schedul/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 其余请求（页面、API、/uploads/ 截图）全部转发给 waitress/Flask。
    # 注意：不要把 /uploads/ 或数据目录单独配置为静态目录，截图必须经过登录校验。
    location / {
        proxy_pass http://schedul_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 配合 upstream keepalive 复用长连接
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}
