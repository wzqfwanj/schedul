{% extends "base.html" %}
{% block content %}
<div class="day-page" data-date="{{ date_iso }}"
     data-api="{{ url_for('api_get_day', date_str=date_iso) }}"
     data-image-api="{{ url_for('api_delete_image', image_id=0) }}">
  <section class="day-head">
    <a class="back" href="{{ url_for('calendar_view', month=month_key) }}">‹ 日历</a>
    <div class="day-title">
      <h1>{{ day.month }}月{{ day.day }}日</h1>
      <p class="day-sub">{{ day.year }}年 · 星期{{ weekday }}</p>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>事件</h2>
      <span id="save-status" class="status" aria-live="polite"></span>
    </div>
    <textarea id="event-input" class="event-input" maxlength="20000" spellcheck="false"
      aria-label="当天事件" placeholder="写下今天要做的事…">{{ event }}</textarea>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>其他</h2>
      <span id="shots-status" class="status" aria-live="polite"></span>
    </div>
    <div id="paste-zone" class="paste-zone" tabindex="0" role="button" aria-label="粘贴或选择截图">
      <p class="paste-hint"><kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴截图</p>
      <p class="paste-sub">PNG / JPG / GIF / WebP · 最大 10MB · 点击选择文件</p>
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      <div id="shots" class="shots">
        {% for image in images %}
        <figure class="shot" data-id="{{ image.id }}" data-src="{{ image.url }}" data-download="{{ image.download_url }}" data-time="{{ image.time_label }}" title="点击查看">
          <img src="{{ image.url }}" alt="截图 {{ image.time_label }}" loading="lazy">
          <button class="shot-del" type="button" aria-label="删除截图" title="删除">×</button>
          <figcaption>{{ image.time_label }} · {{ image.size_label }}</figcaption>
        </figure>
        {% endfor %}
      </div>
      <p id="shots-empty" class="empty"{% if images %} hidden{% endif %}>还没有截图，粘贴的图片会出现在这里</p>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-bar">
    <span id="lightbox-time" class="lightbox-time"></span>
    <div class="lightbox-actions">
      <a id="lightbox-download" class="text-btn" href="#" download>下载</a>
      <button id="lightbox-delete" class="text-btn" type="button">删除</button>
      <button id="lightbox-close" class="icon-btn" type="button" aria-label="关闭预览">×</button>
    </div>
  </div>
  <img id="lightbox-img" class="lightbox-img" alt="截图预览">
</div>
<script src="{{ url_for('static', filename='day.js') }}"></script>
{% endblock %}
